name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk-bundle" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # build-root-directory ထည့်ပေးထားလို့ android folder ထဲကို ဝင်လုပ်သွားပါလိမ့်မယ်
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: android

      # working-directory ကို android လို့ ပြောင်းပေးထားပါတယ်
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # path လမ်းကြောင်းမှာလည်း android/ တိုးပေးထားပါတယ်
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-2D3D-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
